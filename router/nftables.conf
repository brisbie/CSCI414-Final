flush ruleset

table inet shopnet {

  # Named counters so evidence is easy to read: `nft list counters`
  counter allow_client_to_api  { }
  counter allow_client_iperf   { }
  counter allow_api_to_db      { }
  counter allow_ops_to_api     { }
  counter allow_ops_to_db      { }
  counter deny_client_to_data  { }
  counter deny_other           { }

  chain forward {
    type filter hook forward priority filter; policy drop;

    # Replies to allowed connections, plus related ICMP errors
    ct state established,related accept
    ct state invalid drop

    # --- Explicit deny (checked first): the client zone may never touch the data zone
    ip saddr 10.41.1.0/24 ip daddr 10.41.3.0/24 counter name deny_client_to_data log prefix "NFT-DENY client->data " reject with icmpx type admin-prohibited

    # --- Diagnostics: ping along the permitted paths only
    ip saddr 10.41.1.0/24 ip daddr 10.41.2.0/24 icmp type echo-request accept
    ip saddr 10.41.2.0/24 ip daddr 10.41.3.0/24 icmp type echo-request accept
    ip saddr 10.41.4.0/24 icmp type echo-request accept

    # --- Application paths
    ip saddr 10.41.1.0/24 ip daddr 10.41.2.10 tcp dport 8443  ct state new counter name allow_client_to_api accept
    ip saddr 10.41.1.0/24 ip daddr 10.41.2.10 tcp dport 5201  ct state new counter name allow_client_iperf accept
    ip saddr 10.41.2.10   ip daddr 10.41.3.10 tcp dport 27017 ct state new counter name allow_api_to_db accept
    ip saddr 10.41.4.0/24 ip daddr 10.41.2.10 tcp dport 8443  ct state new counter name allow_ops_to_api accept
    ip saddr 10.41.4.0/24 ip daddr 10.41.3.10 tcp dport 27017 ct state new counter name allow_ops_to_db accept

    # --- Anything else is logged and dropped (policy drop would also catch it)
    counter name deny_other log prefix "NFT-DENY other " drop
  }

  # The router itself answers ping/traceroute and nothing else
  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    icmp type { echo-request, echo-reply, time-exceeded, destination-unreachable } accept
  }
}
